name: Inspector UI checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  inspector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/inspector/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- src/generated/graphql.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
