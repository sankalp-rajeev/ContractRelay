name: Historical v2 artifact guards
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node benchmarks/realworld-v3/legacy-check.mjs
      - run: node --import=tsx benchmarks/realworld-v3/evaluate.mjs --validate
      - run: node --import=tsx --test benchmarks/realworld-v3/test/*.test.mjs
      - run: node apps/inspector/scripts/audit-protected.mjs
